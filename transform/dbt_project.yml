name: gridforge
version: "1.0.0"
config-version: 2
profile: gridforge

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

seeds:
  gridforge:
    +schema: reference
    metros:
      +column_types:
        region_code: varchar
        metro: varchar
        latitude: double
        longitude: double
        population_m: double

models:
  gridforge:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
